name: Release

# Publishes a release by itself: a push to main that changes the version in package.json (npm run version:bump,
# commit, push) runs the checks and tests, builds Lumen for Windows, Linux and macOS (Apple Silicon), creates the tag
# v<version> on that commit and publishes the release. A version that already has its tag is skipped, so nothing is
# published twice. "Run workflow" on the Actions page does the same for the current version (e.g. after a failed run).
#
# One file per system, and the same file installs and updates (src-tauri/src/updater.rs downloads it):
#   Lumen-setup.exe          Windows: the setup wizard (Inno Setup, src-tauri/installer/lumen.iss) - also the update
#   lumen-linux-x64          Linux: the program; it installs itself (app menu entry) on its first start
#   lumen-macos-arm64        macOS: the program, what an update downloads
#   Lumen-macos-arm64.dmg    macOS: Lumen.app to drag into Applications (the first install)
#   SHA256SUMS.txt           checksums of all of them: an update refuses a file that doesn't match
# The release notes are the version's section of CHANGELOG.md (scripts/release-notes.ps1).

on:
  push:
    branches: [main]
    # (this file too: a change to how releases are made publishes the current version if it isn't out yet)
    paths: [package.json, .github/workflows/release.yml]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    name: New version?
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      publish: ${{ steps.v.outputs.publish }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          v="$(node -p "require('./package.json').version")"
          c="$(sed -nE 's/^version[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' src-tauri/Cargo.toml | head -n1)"
          echo "package.json=$v Cargo.toml=$c"
          test "$v" = "$c" || { echo "::error::package.json $v and src-tauri/Cargo.toml $c differ - use npm run version:bump"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"
          # (versions like 1.0.0-beta.1 become pre-releases)
          case "$v" in *-*) echo "prerelease=true" ;; *) echo "prerelease=false" ;; esac >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$v" > /dev/null; then
            echo "::notice::v$v is already released: nothing to publish (bump the version for a new release)"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

  tests:
    name: App tests (${{ matrix.os }})
    needs: check
    if: needs.check.outputs.publish == 'true'
    strategy:
      matrix:
        os: [windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux desktop libraries (WebKitGTK, app indicator)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --check ui/app.js && node --check ui/i18n.js
        shell: bash
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Rust tests
        working-directory: src-tauri
        run: cargo test --locked

  build:
    name: Build (${{ matrix.name }})
    needs: tests
    strategy:
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            bin: lumen.exe
            asset: Lumen-setup.exe   # (made by the setup step below: the only Windows file)
          - name: linux-x64
            # (the oldest supported Ubuntu: the program then also runs on older Linux systems)
            os: ubuntu-22.04
            bin: lumen
            asset: lumen-linux-x64
          - name: macos-arm64
            # (Apple Silicon only; the linker gives an arm64 program the ad-hoc signature macOS needs to run it)
            os: macos-15
            bin: lumen
            asset: lumen-macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux desktop libraries (WebKitGTK, app indicator)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: npm packages
        run: npm ci --no-audit --no-fund
      - name: Build the program (the UI is packed inside)
        run: npx tauri build --no-bundle --ci
      - name: Name it for the release
        shell: bash
        run: |
          mkdir -p dist
          # (Windows has ONE file, the setup below: it installs and it updates. Linux and macOS: the program itself,
          # which also updates itself from it)
          if [ "${{ runner.os }}" != "Windows" ]; then cp "src-tauri/target/release/${{ matrix.bin }}" "dist/${{ matrix.asset }}"; fi
      - name: Windows setup wizard (Lumen-setup.exe, with its uninstaller)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          $v = (Get-Content package.json -Raw | ConvertFrom-Json).version
          & $iscc /Qp "/DAppVersion=$v" "/DExe=$PWD\src-tauri\target\release\lumen.exe" "/O$PWD\dist" src-tauri\installer\lumen.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: macOS app in a disk image (Lumen-macos-arm64.dmg)
        if: runner.os == 'macOS'
        run: |
          v="${{ needs.check.outputs.version }}"
          app="dmg/Lumen.app"
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
          cp src-tauri/target/release/lumen "$app/Contents/MacOS/lumen"
          cp src-tauri/icons/icon.icns "$app/Contents/Resources/icon.icns"
          sed "s/@VERSION@/$v/g" src-tauri/installer/Info.plist > "$app/Contents/Info.plist"
          codesign --force --deep --sign - "$app"   # (ad hoc: no certificate; macOS asks once on first open)
          ln -s /Applications dmg/Applications
          hdiutil create -volname Lumen -srcfolder dmg -ov -format UDZO dist/Lumen-macos-arm64.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish the release
    needs: [check, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Release notes from CHANGELOG.md
        shell: pwsh
        run: ./scripts/release-notes.ps1 -Version "${{ needs.check.outputs.version }}" -OutFile notes.md
      - name: Tag and publish (the tag v<version> is created on this commit)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.check.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Lumen ${{ needs.check.outputs.version }}
          body_path: notes.md
          files: dist/*
          fail_on_unmatched_files: true
          prerelease: ${{ needs.check.outputs.prerelease }}
          make_latest: ${{ needs.check.outputs.prerelease != 'true' }}
