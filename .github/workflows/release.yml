# Builds Lumen for Windows and publishes a GitHub release.
#
#   - Push to main with a package.json version that has no tag yet (npm run version:bump, commit, push)
#       -> build, create tag vX.Y.Z on that commit, publish release vX.Y.Z
#   - Push to main where the version is already released -> nothing to do (the check job skips the build)
#   - Run manually (Actions tab) -> build only; tick `publish` for a draft release of an unreleased version
#
# Release assets:
#   Lumen-vX.Y.Z-windows-x64-portable.zip   Lumen\Lumen.exe (data is stored in Lumen\LumenData)
#   Lumen_X.Y.Z_x64-setup.exe               NSIS installer (per-user, no admin)
#   SHA256SUMS.txt
# The release body is the matching CHANGELOG.md section (scripts/release-notes.ps1).
name: Release

on:
  push:
    branches: [main]
    # the version lives in package.json; the workflow file is listed so a change to it re-checks the version
    paths: [package.json, .github/workflows/release.yml]
  workflow_dispatch:
    inputs:
      publish:
        description: "Also publish a draft release for the current package.json version (if it is not released yet)"
        type: boolean
        default: false

permissions:
  contents: write

# one release run at a time, never cancelled half-way through publishing
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      tag: ${{ steps.ver.outputs.tag }}
      prerelease: ${{ steps.ver.outputs.prerelease }}
      build: ${{ steps.ver.outputs.build }}
      publish: ${{ steps.ver.outputs.publish }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version and whether it is new
        id: ver
        env:
          EVENT: ${{ github.event_name }}
          MANUAL_PUBLISH: ${{ inputs.publish }}
        run: |
          pkg=$(node -p "require('./package.json').version")
          cargo=$(sed -nE 's/^version[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' src-tauri/Cargo.toml | head -n1)
          if [ "$pkg" != "$cargo" ]; then
            echo "::error::package.json ($pkg) and Cargo.toml ($cargo) versions differ - use npm run version:bump"
            exit 1
          fi
          tag="v$pkg"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then released=true; else released=false; fi

          build=false; publish=false
          if [ "$EVENT" = "workflow_dispatch" ]; then
            build=true
            if [ "$MANUAL_PUBLISH" = "true" ] && [ "$released" = "false" ]; then publish=true; fi
          elif [ "$released" = "false" ]; then
            build=true; publish=true
          fi
          if [ "$released" = "true" ]; then echo "::notice::$tag is already released - nothing to publish"; fi
          # versions like 1.0.0-beta.1 become pre-releases
          case "$pkg" in *-*) pre=true ;; *) pre=false ;; esac
          {
            echo "version=$pkg"; echo "tag=$tag"; echo "prerelease=$pre"
            echo "build=$build"; echo "publish=$publish"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: check
    if: needs.check.outputs.build == 'true'
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: lumen

      - name: Release notes from CHANGELOG.md
        run: ./scripts/release-notes.ps1 -Version "${{ needs.check.outputs.version }}" -OutFile release-notes.md

      - name: Install npm packages
        run: npm ci --no-audit --no-fund

      - name: Build (exe + NSIS installer)
        run: npx tauri build --ci

      - name: Package assets
        run: |
          $v = "${{ needs.check.outputs.version }}"
          $out = New-Item -ItemType Directory -Force "release-assets"

          # portable zip: Lumen\Lumen.exe (+ readme); LumenData is created on first run
          $stage = New-Item -ItemType Directory -Force "stage\Lumen"
          Copy-Item "src-tauri\target\release\lumen.exe" "$stage\Lumen.exe"
          Copy-Item README.md, CHANGELOG.md $stage
          Compress-Archive -Path "stage\Lumen" -DestinationPath "$out\Lumen-v$v-windows-x64-portable.zip" -CompressionLevel Optimal

          # installer
          $setup = Get-ChildItem "src-tauri\target\release\bundle\nsis\*-setup.exe" | Select-Object -First 1
          if (-not $setup) { throw "NSIS installer was not produced" }
          Copy-Item $setup.FullName $out

          # checksums
          Get-ChildItem $out -File | ForEach-Object {
            "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name
          } | Set-Content "$out\SHA256SUMS.txt" -Encoding ascii
          Get-ChildItem $out | Format-Table Name, Length

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lumen-${{ needs.check.outputs.tag }}-windows-x64
          path: release-assets/*
          if-no-files-found: error

      # creates the tag on the built commit; manual runs only make a draft
      - name: Publish GitHub release
        if: needs.check.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.check.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Lumen ${{ needs.check.outputs.tag }}
          body_path: release-notes.md
          draft: ${{ github.event_name == 'workflow_dispatch' }}
          prerelease: ${{ needs.check.outputs.prerelease }}
          files: release-assets/*
          fail_on_unmatched_files: true
