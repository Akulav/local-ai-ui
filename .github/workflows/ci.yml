name: CI

# Checks every push to main and every pull request on all three systems: the versions agree, the UI scripts parse,
# the Rust backend passes clippy (no warnings) and its tests, and the Windows setup compiles.
# Releases are made by release.yml.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version:
    name: Versions agree
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: package.json and src-tauri/Cargo.toml carry the same number
        run: |
          v="$(node -p "require('./package.json').version")"
          c="$(sed -nE 's/^version[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' src-tauri/Cargo.toml | head -n1)"
          echo "package.json=$v  Cargo.toml=$c"
          test "$v" = "$c"
      - name: UI scripts parse
        run: node --check ui/app.js && node --check ui/i18n.js && node --check scripts/vendor.js

  app:
    name: App (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04, macos-15]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v4
      - name: Linux desktop libraries (WebKitGTK, app indicator)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - name: The Windows setup compiles (src-tauri/installer/lumen.iss)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cargo build --locked
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc /Qp "/DAppVersion=0.0.0" "/DExe=$PWD\target\debug\lumen.exe" "/O$env:RUNNER_TEMP" installer\lumen.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
