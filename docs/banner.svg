<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10131a"/>
      <stop offset="1" stop-color="#0b0d12"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c6cff"/>
      <stop offset="1" stop-color="#22b8f0"/>
    </linearGradient>
    <linearGradient id="text" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#c9c3ff"/>
    </linearGradient>
    <radialGradient id="aura" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7c6cff" stop-opacity="0.45"/>
      <stop offset="0.55" stop-color="#22b8f0" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#22b8f0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="core" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.6" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#cfe6ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#ffffff" fill-opacity="0.05"/>
    </pattern>
  </defs>

  <rect width="1280" height="360" rx="24" fill="url(#bg)"/>
  <rect width="1280" height="360" rx="24" fill="url(#dots)"/>
  <circle cx="1080" cy="40" r="260" fill="url(#aura)" opacity="0.5"/>
  <circle cx="250" cy="180" r="230" fill="url(#aura)"/>

  <!-- App icon -->
  <g transform="translate(250 180)">
    <rect x="-110" y="-110" width="220" height="220" rx="52" fill="url(#brand)"/>
    <rect x="-110" y="-110" width="220" height="220" rx="52" fill="none" stroke="#ffffff" stroke-opacity="0.18" stroke-width="2"/>
    <circle r="74" fill="none" stroke="#ffffff" stroke-opacity="0.75" stroke-width="5" filter="url(#glow)"/>
    <circle r="62" fill="url(#core)" opacity="0.35"/>
    <path filter="url(#glow)" fill="#ffffff"
          d="M0,-96 Q12,-12 96,0 Q12,12 0,96 Q-12,12 -96,0 Q-12,-12 0,-96 Z"/>
  </g>

  <!-- Wordmark -->
  <text x="430" y="178" font-family="Segoe UI, Inter, system-ui, -apple-system, sans-serif"
        font-size="104" font-weight="700" letter-spacing="-2" fill="url(#text)">Lumen</text>
  <text x="434" y="230" font-family="Segoe UI, Inter, system-ui, -apple-system, sans-serif"
        font-size="30" font-weight="400" fill="#a8b0c2">Hassle-free local AI for Windows.</text>

  <!-- Chips -->
  <g font-family="Segoe UI, Inter, system-ui, -apple-system, sans-serif" font-size="17" font-weight="600" fill="#d6dbe6">
    <rect x="434" y="262" width="150" height="36" rx="18" fill="#7c6cff" fill-opacity="0.16" stroke="#7c6cff" stroke-opacity="0.5"/>
    <text x="509" y="286" text-anchor="middle">One portable exe</text>
    <rect x="596" y="262" width="166" height="36" rx="18" fill="#22b8f0" fill-opacity="0.12" stroke="#22b8f0" stroke-opacity="0.5"/>
    <text x="679" y="286" text-anchor="middle">llama.cpp · Vulkan</text>
    <rect x="774" y="262" width="150" height="36" rx="18" fill="#7c6cff" fill-opacity="0.16" stroke="#7c6cff" stroke-opacity="0.5"/>
    <text x="849" y="286" text-anchor="middle">Private by default</text>
    <rect x="936" y="262" width="176" height="36" rx="18" fill="#22b8f0" fill-opacity="0.12" stroke="#22b8f0" stroke-opacity="0.5"/>
    <text x="1024" y="286" text-anchor="middle">Projects · RAG · Tools</text>
  </g>
</svg>
