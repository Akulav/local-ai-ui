<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Lumen</title>
  <link rel="stylesheet" href="vendor/hljs-dark.css" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app">
    <aside class="sidebar">
      <div class="brand"><img src="logo.png" alt="" /><b>Lumen</b><span>local</span></div>
      <button class="new-btn" id="newBtn"></button>
      <div class="tabs">
        <button data-tab="chats" class="on" id="tabChats"></button>
        <button data-tab="projects" id="tabProjects"></button>
      </div>
      <div class="search"><span id="searchIc"></span><input id="searchInp" /></div>
      <div class="list" id="sideList"></div>
      <div class="side-foot">
        <div id="navUpdate"></div>
        <div class="item" data-nav="models" id="navModels"></div>
        <div class="item" data-nav="settings" id="navSettings"></div>
        <div class="credit" id="credit"></div>
      </div>
    </aside>

    <main>
      <header class="topbar" id="topbar"></header>

      <section class="view" id="view-chat">
        <div class="scroller" id="scroller"><div class="thread" id="thread"></div></div>
        <div class="composer-wrap">
          <button class="jump-btn" id="jumpBtn"></button>
          <div class="composer">
            <textarea id="input" rows="1"></textarea>
            <div class="comp-row">
              <button class="toggle" id="tThink"></button>
              <button class="toggle" id="tWeb"></button>
              <button class="toggle research" id="tResearch"></button>
              <div class="spacer"></div>
              <button class="send" id="sendBtn"></button>
            </div>
          </div>
          <div class="hint" id="hint"></div>
        </div>
      </section>

      <section class="view" id="view-models"><div class="page"><div class="page-in" id="modelsPage"></div></div></section>
      <section class="view" id="view-settings"><div class="page"><div class="page-in" id="settingsPage"></div></div></section>
      <section class="view" id="view-project"><div class="page"><div class="page-in" id="projectPage"></div></div></section>

      <footer class="statusbar" id="statusbar"></footer>
    </main>
  </div>
  <div class="engine-panel" id="enginePanel"></div>
  <div class="toast-wrap" id="toasts"></div>

  <script src="vendor/marked.umd.js"></script>
  <script src="vendor/purify.min.js"></script>
  <script src="vendor/highlight.min.js"></script>
  <script src="i18n.js"></script>
  <script src="app.js"></script>
</body>
</html>
